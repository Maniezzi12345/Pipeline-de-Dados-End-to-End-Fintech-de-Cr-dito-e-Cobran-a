name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  data_referencia: '2026-10-22'

models:
  my_new_project:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
      dimensoes:
        +tags: ['gold', 'dimensao']
      fatos:
        +tags: ['gold', 'fato']
      consumo:
        +tags: ['gold', 'consumo']